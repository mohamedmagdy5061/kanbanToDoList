name: CI

on:
  push:
    branches: [main]
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install dependencies
        run: | 
          npm install

      - name: Run Eslint
        run: |
          npm run lint
     
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install dependencies
        run: | 
          npm install

      - name: Start JSON Server
        run: npm run server &

      - name: Wait for JSON Server
        run: npx wait-on http://localhost:4000

      - name: Build React App
        run: |
          npm run build

